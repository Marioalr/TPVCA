<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Agenda</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Inter,system-ui,sans-serif;color:#0F172A}
a{color:#0369A1;text-decoration:none}a:hover{color:#075985}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F8FAFC; display: flex; flex-direction: column; font-family: Inter, system-ui, sans-serif; color: #0F172A; position: relative">
  <header style="padding: 20px 20px 8px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <h1 style="margin: 0; font-size: 24px; font-weight: 700">Agenda</h1>
      <span style="font-size: 14px; font-weight: 500; color: #475569">Noviembre 2026</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px">
      <sc-for list="{{days}}" as="d" hint-placeholder-count="6">
        <button onClick="{{d.pick}}" aria-pressed="{{d.selected}}" style="{{d.style}}">
          <span style="font-size: 11px; font-weight: 500">{{d.dow}}</span>
          <span style="font-size: 17px; font-weight: 700">{{d.num}}</span>
        </button>
      </sc-for>
    </div>
  </header>

  <main style="flex: 1; overflow: auto; padding: 8px 16px 96px; display: flex; flex-direction: column; gap: 10px">
    <span style="font-size: 13px; font-weight: 600; color: #64748B; margin: 0 4px">{{dayTitle}}</span>
    <sc-for list="{{appts}}" as="a" hint-placeholder-count="5">
      <a href="Ficha.dc.html" style="display: flex; gap: 12px; background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 14px; padding: 12px 14px; color: #0F172A">
        <span style="display: flex; flex-direction: column; width: 50px; flex-shrink: 0">
          <span style="font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums">{{a.time}}</span>
          <span style="font-size: 11px; color: #64748B">{{a.duration}}</span>
        </span>
        <span style="flex: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0">
          <span style="font-size: 15px; font-weight: 500">{{a.name}}</span>
          <span style="font-size: 12px; color: #64748B">{{a.reason}}</span>
          <sc-if value="{{a.overlap}}" hint-placeholder-val="{{false}}">
            <span style="align-self: flex-start; margin-top: 4px; font-size: 11px; font-weight: 600; color: #92400E; background: #FEF3C7; border-radius: 10px; padding: 3px 8px">Empalme con {{a.overlapWith}}</span>
          </sc-if>
        </span>
        <span style="align-self: center; font-size: 11px; font-weight: 600; border-radius: 10px; padding: 3px 8px; {{a.statusStyle}}">{{a.status}}</span>
      </a>
    </sc-for>
  </main>

  <div style="position: absolute; right: 20px; bottom: 88px; display: flex; flex-direction: column; align-items: flex-end; gap: 6px">
    <button disabled aria-describedby="agendar-nota" style="min-height: 52px; padding: 0 20px; border-radius: 26px; border: none; background: #CBD5E1; color: #475569; font: 600 15px Inter, sans-serif; display: flex; align-items: center; gap: 8px; cursor: not-allowed">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      Agendar cita
    </button>
    <span id="agendar-nota" style="font-size: 11px; font-weight: 500; color: #475569; background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 8px; padding: 3px 8px">En la siguiente versión</span>
  </div>

  <nav aria-label="Secciones" style="height: 72px; flex-shrink: 0; background: #FFFFFF; border-top: 1px solid #E2E8F0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr))">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 500; color: #64748B">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 11 12 4l9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Inicio</a>
    <a href="Pacientes.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 500; color: #64748B">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0M17 4a4 4 0 0 1 0 8M22 21a7 7 0 0 0-4-6.3"/></svg>Pacientes</a>
    <a href="Agenda.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 600; color: #0369A1">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/></svg>Agenda</a>
    <a href="Inventario.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 500; color: #64748B">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>Inventario</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { day: 3 };
  }
  renderVals() {
    const day = this.state.day;
    const defs = [
      { num: 3, dow: 'Lun', title: 'Lunes 3 de noviembre' },
      { num: 4, dow: 'Mar', title: 'Martes 4 de noviembre' },
      { num: 5, dow: 'Mié', title: 'Miércoles 5 de noviembre' },
      { num: 6, dow: 'Jue', title: 'Jueves 6 de noviembre' },
      { num: 7, dow: 'Vie', title: 'Viernes 7 de noviembre' },
      { num: 8, dow: 'Sáb', title: 'Sábado 8 de noviembre' }
    ];
    const on = 'min-height: 58px; border-radius: 12px; border: 1px solid #0369A1; background: #0369A1; color: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-family: Inter, sans-serif; cursor: pointer';
    const off = 'min-height: 58px; border-radius: 12px; border: 1px solid #E2E8F0; background: #FFFFFF; color: #0F172A; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-family: Inter, sans-serif; cursor: pointer';
    const done = 'color: #047857; background: #D1FAE5';
    const pend = 'color: #0369A1; background: #E0F2FE';
    const today = [
      { time: '09:00', duration: '30 min', name: 'Roberto Hernández', reason: 'Control de presión', status: 'Atendida', statusStyle: done, overlap: false },
      { time: '10:30', duration: '30 min', name: 'Ana López Ruiz', reason: 'Seguimiento', status: 'Programada', statusStyle: pend, overlap: true, overlapWith: 'Juan Pérez (10:45)' },
      { time: '10:45', duration: '30 min', name: 'Juan Pérez Gómez', reason: 'Consulta general', status: 'Programada', statusStyle: pend, overlap: true, overlapWith: 'Ana López (10:30)' },
      { time: '12:15', duration: '20 min', name: 'Sofía Martínez Cruz', reason: 'Retiro de puntos', status: 'Programada', statusStyle: pend, overlap: false },
      { time: '17:00', duration: '30 min', name: 'Lucía García Torres', reason: 'Revisión de laboratorios', status: 'Programada', statusStyle: pend, overlap: false }
    ];
    const other = [
      { time: '10:00', duration: '30 min', name: 'Carmen Flores Vega', reason: 'Seguimiento', status: 'Programada', statusStyle: pend, overlap: false },
      { time: '16:30', duration: '30 min', name: 'Mateo Ramírez Díaz', reason: 'Consulta general', status: 'Programada', statusStyle: pend, overlap: false }
    ];
    const current = defs.find((d) => d.num === day) || defs[0];
    return {
      days: defs.map((d) => ({ ...d, selected: d.num === day ? 'true' : 'false', style: d.num === day ? on : off, pick: () => this.setState({ day: d.num }) })),
      dayTitle: current.title,
      appts: day === 3 ? today : other
    };
  }
}
</script>
</body>
</html>
