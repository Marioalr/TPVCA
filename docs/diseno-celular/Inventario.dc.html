<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Inventario</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Inter,system-ui,sans-serif;color:#0F172A}
a{color:#0369A1;text-decoration:none}a:hover{color:#075985}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F8FAFC; display: flex; flex-direction: column; font-family: Inter, system-ui, sans-serif; color: #0F172A">
  <header style="padding: 20px 20px 12px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <h1 style="margin: 0; font-size: 24px; font-weight: 700">Inventario</h1>
      <button disabled title="En la siguiente versión" aria-label="Entrada de mercancía, en la siguiente versión" style="min-height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid #E2E8F0; background: #F1F5F9; color: #64748B; font: 500 13px Inter, sans-serif; display: flex; align-items: center; gap: 6px; cursor: not-allowed">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Entrada
      </button>
    </div>
    <label style="display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 14px; background: #FFFFFF; border: 1px solid #CBD5E1; border-radius: 12px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input type="search" placeholder="Nombre, genérico o código" aria-label="Buscar producto" style="flex: 1; border: none; outline: none; background: transparent; font: 400 15px Inter, sans-serif; color: #0F172A">
    </label>
    <div style="display: flex; gap: 8px; flex-wrap: wrap">
      <sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
        <button onClick="{{f.pick}}" aria-pressed="{{f.selected}}" style="{{f.style}}">{{f.label}}</button>
      </sc-for>
    </div>
  </header>

  <main style="flex: 1; overflow: auto; padding: 0 16px 16px">
    <div style="background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 16px; overflow: hidden">
      <sc-for list="{{items}}" as="p" hint-placeholder-count="7">
        <a href="Producto.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 68px; padding: 10px 16px; box-sizing: border-box; color: #0F172A; border-bottom: 1px solid #E2E8F0">
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
            <span style="font-size: 15px; font-weight: 500">{{p.name}}</span>
            <span style="font-size: 12px; color: #64748B">{{p.detail}}</span>
          </span>
          <span style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0">
            <span style="font-size: 11px; font-weight: 600; border-radius: 10px; padding: 3px 8px; {{p.badgeStyle}}">{{p.badge}}</span>
            <span style="font-size: 12px; color: #64748B; font-variant-numeric: tabular-nums">{{p.price}}</span>
          </span>
        </a>
      </sc-for>
    </div>
  </main>

  <nav aria-label="Secciones" style="height: 72px; flex-shrink: 0; background: #FFFFFF; border-top: 1px solid #E2E8F0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr))">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 500; color: #64748B">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 11 12 4l9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Inicio</a>
    <a href="Pacientes.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 500; color: #64748B">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0M17 4a4 4 0 0 1 0 8M22 21a7 7 0 0 0-4-6.3"/></svg>Pacientes</a>
    <a href="Agenda.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 500; color: #64748B">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/></svg>Agenda</a>
    <a href="Inventario.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 600; color: #0369A1">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>Inventario</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { filter: 'todo' };
  }
  renderVals() {
    const filter = this.state.filter;
    const on = 'min-height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #0369A1; background: #0369A1; color: #FFFFFF; font: 500 13px Inter, sans-serif; cursor: pointer';
    const off = 'min-height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #CBD5E1; background: #FFFFFF; color: #0F172A; font: 500 13px Inter, sans-serif; cursor: pointer';
    const ok = 'color: #047857; background: #D1FAE5';
    const low = 'color: #92400E; background: #FEF3C7';
    const bad = 'color: #B91C1C; background: #FEE2E2';
    const all = [
      { kind: 'med', alert: true, name: 'Tempra 500 mg tabletas', detail: 'Paracetamol · Caja con 20 · MED-014', badge: '−3 · revisar inventario', badgeStyle: bad, price: '$48.00' },
      { kind: 'med', alert: true, name: 'Amoxicilina 500 mg cápsulas', detail: 'Amoxicilina · Caja con 12 · lote vence 12 nov', badge: 'Stock bajo: 2', badgeStyle: low, price: '$85.00' },
      { kind: 'med', alert: false, name: 'Ibuprofeno 400 mg tabletas', detail: 'Ibuprofeno · Caja con 10 · MED-003', badge: 'Existencias: 35', badgeStyle: ok, price: '$55.00' },
      { kind: 'med', alert: false, name: 'Omeprazol 20 mg cápsulas', detail: 'Omeprazol · Caja con 14 · MED-004', badge: 'Existencias: 50', badgeStyle: ok, price: '$60.00' },
      { kind: 'ins', alert: true, name: 'Gasa estéril 10x10 cm', detail: 'Sobre con 5 · abierto 3/5 pzas', badge: 'Stock bajo: 4 (+3/5)', badgeStyle: low, price: '$18.00' },
      { kind: 'ins', alert: false, name: 'Jeringa 5 ml con aguja', detail: 'Pieza estéril · INS-002', badge: 'Existencias: 85', badgeStyle: ok, price: '$12.00' },
      { kind: 'ins', alert: false, name: 'Venda elástica 10 cm', detail: 'Rollo 5 m · INS-004', badge: 'Existencias: 40', badgeStyle: ok, price: '$25.00' }
    ];
    const defs = [
      { id: 'todo', label: 'Todo' },
      { id: 'med', label: 'Medicamentos' },
      { id: 'ins', label: 'Insumos' },
      { id: 'alertas', label: 'Con aviso' }
    ];
    const items = all.filter((p) => filter === 'todo' || (filter === 'alertas' ? p.alert : p.kind === filter));
    return {
      filters: defs.map((d) => ({ ...d, selected: d.id === filter ? 'true' : 'false', style: d.id === filter ? on : off, pick: () => this.setState({ filter: d.id }) })),
      items
    };
  }
}
</script>
</body>
</html>
