<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Pacientes</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Inter,system-ui,sans-serif;color:#0F172A}
a{color:#0369A1;text-decoration:none}a:hover{color:#075985}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F8FAFC; display: flex; flex-direction: column; font-family: Inter, system-ui, sans-serif; color: #0F172A">
  <header style="padding: 20px 20px 12px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <h1 style="margin: 0; font-size: 24px; font-weight: 700">Pacientes</h1>
      <span style="font-size: 12px; font-weight: 500; color: #475569; background: #F1F5F9; border-radius: 12px; padding: 4px 10px">Solo consulta</span>
    </div>
    <label style="display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 14px; background: #FFFFFF; border: 1px solid #CBD5E1; border-radius: 12px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input type="search" placeholder="Nombre, teléfono o folio" aria-label="Buscar paciente" style="flex: 1; border: none; outline: none; background: transparent; font: 400 15px Inter, sans-serif; color: #0F172A">
    </label>
    <div style="display: flex; gap: 8px">
      <button aria-pressed="true" style="min-height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #0369A1; background: #0369A1; color: #FFFFFF; font: 500 13px Inter, sans-serif; cursor: pointer">Recientes</button>
      <button aria-pressed="false" style="min-height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #CBD5E1; background: #FFFFFF; color: #0F172A; font: 500 13px Inter, sans-serif; cursor: pointer">Con cita hoy</button>
      <button aria-pressed="false" style="min-height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #CBD5E1; background: #FFFFFF; color: #0F172A; font: 500 13px Inter, sans-serif; cursor: pointer">A–Z</button>
    </div>
  </header>

  <main style="flex: 1; overflow: auto; padding: 0 16px 16px">
    <div style="background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 16px; overflow: hidden">
      <sc-for list="{{patients}}" as="p" hint-placeholder-count="7">
        <a href="Ficha.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 68px; padding: 0 16px; color: #0F172A; border-bottom: 1px solid #E2E8F0">
          <span style="width: 40px; height: 40px; border-radius: 20px; background: #E0F2FE; color: #0369A1; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; flex-shrink: 0">{{p.initials}}</span>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
            <span style="font-size: 15px; font-weight: 500">{{p.name}}</span>
            <span style="font-size: 12px; color: #64748B">{{p.detail}}</span>
          </span>
          <sc-if value="{{p.allergy}}" hint-placeholder-val="{{false}}">
            <span style="font-size: 11px; font-weight: 600; color: #B91C1C; background: #FEE2E2; border-radius: 10px; padding: 3px 8px">Alergias</span>
          </sc-if>
        </a>
      </sc-for>
    </div>
  </main>

  <nav aria-label="Secciones" style="height: 72px; flex-shrink: 0; background: #FFFFFF; border-top: 1px solid #E2E8F0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr))">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 500; color: #64748B">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 11 12 4l9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Inicio</a>
    <a href="Pacientes.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 600; color: #0369A1">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0M17 4a4 4 0 0 1 0 8M22 21a7 7 0 0 0-4-6.3"/></svg>Pacientes</a>
    <a href="Agenda.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 500; color: #64748B">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/></svg>Agenda</a>
    <a href="Inventario.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 500; color: #64748B">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>Inventario</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      patients: [
        { initials: 'AL', name: 'Ana López Ruiz', detail: 'EXP-2026-014 · 34 años · cita hoy 10:30', allergy: true },
        { initials: 'JP', name: 'Juan Pérez Gómez', detail: 'EXP-2026-009 · 58 años · cita hoy 11:00', allergy: false },
        { initials: 'SM', name: 'Sofía Martínez Cruz', detail: 'EXP-2025-188 · 7 años · cita hoy 12:15', allergy: true },
        { initials: 'RH', name: 'Roberto Hernández', detail: 'EXP-2025-152 · 41 años · última visita 28 oct', allergy: false },
        { initials: 'LG', name: 'Lucía García Torres', detail: 'EXP-2025-101 · 66 años · última visita 24 oct', allergy: false },
        { initials: 'MR', name: 'Mateo Ramírez Díaz', detail: 'EXP-2026-T1-003 · 3 años · última visita 20 oct', allergy: false },
        { initials: 'CF', name: 'Carmen Flores Vega', detail: 'EXP-2024-077 · 29 años · última visita 15 oct', allergy: true }
      ]
    };
  }
}
</script>
</body>
</html>
